<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SkillMatch AI - Login</title>
    <link rel="icon" type="image/svg+xml" href="./images/favicon.svg" />
    <meta name="theme-color" content="#4f46e5" />

    <!-- Bootstrap -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

    <!-- SweetAlert2 -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

    <link rel="stylesheet" href="assets/css/style.css" />
  </head>
  <body
    class="d-flex align-items-center justify-content-center vh-100"
    style="background: linear-gradient(135deg, #4f46e5, #06b6d4)"
  >
    <main class="text-center fade-in">
      <!-- Headings above the card -->
      <h1 class="login-title">Welcome — Get Personalized Job Insights!</h1>
      <p class="login-subtitle">
        Login to continue your personalized job insights.
      </p>

      <!-- Login Card -->
      <div class="card shadow-lg p-4 mx-auto login-card">
        <form id="loginForm">
          <div class="mb-3 text-start">
            <label for="username" class="form-label">Username</label>
            <input
              type="text"
              class="form-control"
              id="username"
              placeholder="test_user"
              required
            />
          </div>

          <div class="mb-3 text-start">
            <label for="password" class="form-label">Password</label>
            <input
              type="password"
              class="form-control"
              id="password"
              placeholder="testpassword"
              required
            />
          </div>

          <button type="submit" class="btn btn-primary w-100">Login</button>
          <p class="hint-text">
            🔐 <em>Use demo credentials shown above to log in</em>
          </p>
        </form>
      </div>
    </main>

    <script src="assets/js/api.js"></script>
    <script src="assets/js/auth.js"></script>
  </body>
</html>
